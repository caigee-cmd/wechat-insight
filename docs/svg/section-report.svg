  Compact 1200×140 with chat-bubble + mini chart motif.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="s2-title s2-desc">
