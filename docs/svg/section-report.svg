    <rect x="8" y="14" width="5" height="8" rx="1" fill="#07C160" opacity="0.5"/>
    <rect x="16" y="10" width="5" height="12" rx="1" fill="#07C160" opacity="0.5"/>
    <rect x="24" y="7" width="5" height="15" rx="1" fill="#07C160" opacity="0.5"/>
  </g>

  <text x="116" y="56" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="14" font-weight="600" letter-spacing="3" fill="#E85A3C">02 · 你会得到什么</text>

  <text x="64" y="110" font-family="'Songti SC', 'Source Han Serif SC', 'Noto Serif CJK SC', serif"
