<!--
  Section header · 04 · 脱敏样例
  Compact 1200×140 with chat-bubble + eye/preview motif.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="s4-title s4-desc">
  <title id="s4-title">04 · 脱敏样例</title>
  <desc id="s4-desc">不想安装？先看样例</desc>

  <rect width="1200" height="140" fill="#FFFBF5"/>
  <rect width="1200" height="3" fill="#E85A3C" opacity="0.6"/>

  <!-- chat bubble motif with eye -->
  <g transform="translate(64 38)">
    <rect width="36" height="26" rx="8" fill="#07C160" opacity="0.18"/>
    <path d="M4,26 L0,34 L8,26 Z" fill="#07C160" opacity="0.18"/>
    <ellipse cx="18" cy="13" rx="8" ry="5" fill="none" stroke="#07C160" stroke-width="1.3" opacity="0.6"/>
    <circle cx="18" cy="13" r="2.5" fill="#07C160" opacity="0.5"/>
  </g>

  <text x="116" y="56" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="14" font-weight="600" letter-spacing="3" fill="#E85A3C">04 · 脱敏样例</text>

  <text x="64" y="110" font-family="'Songti SC', 'Source Han Serif SC', 'Noto Serif CJK SC', serif"
        font-size="44" font-weight="900" fill="#1A1A1A">不想安装？先看样例</text>
</svg>
